<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hoolio Apartments">
<title>Hoolio Apartments — Room Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0effe;
    --surface: #ffffff;
    --border: #d8d4f8;
    --border-strong: #b0a8f0;
    --text: #1a1145;
    --text-muted: #5a4e8a;
    --text-faint: #9a90c0;
    --green-bg: #e4f5ec; --green-border: #7ecfa0; --green-text: #145c30;
    --blue-bg: #dceeff; --blue-border: #6aaee8; --blue-text: #0a3a6e;
    --amber-bg: #fdf0d8; --amber-border: #f5c96a; --amber-text: #6b3e00;
    --purple-bg: #eeedfe; --purple-border: #b8b2f0; --purple-text: #322882;
    --red-bg: #fdeaea; --red-border: #f0a0a0; --red-text: #7a1515;
    --primary: #7c3aed;
    --primary-dark: #6424d4;
    --primary-light: #8b5cf6;
    --radius: 10px; --radius-sm: 6px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    min-height: 100vh;
  }

  header {
    background: var(--primary);
    border-bottom: 1px solid var(--primary-dark);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .app-title { font-size: 15px; font-weight: 500; color: #ffffff; }
  .date-input {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 6px 11px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.15);
    color: #ffffff;
    width: 170px;
  }
  .date-input::placeholder { color: rgba(255,255,255,0.55); }
  .date-input:focus { outline: none; border-color: rgba(255,255,255,0.5); }

  .header-right { display: flex; gap: 8px; align-items: center; }

  button {
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    border-radius: var(--radius-sm);
    font-size: 13px;
    padding: 7px 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: background 0.12s;
  }
  button:hover { background: var(--bg); }

  .btn-copy { background: #ffffff; border-color: #ffffff; color: var(--primary); font-weight: 500; }
  .btn-copy:hover { background: #f0effe; }
  .btn-reset { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); color: #e8e0ff; }
  .btn-reset:hover { background: rgba(255,255,255,0.22); }

  .save-indicator {
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .save-dot { width: 6px; height: 6px; border-radius: 50%; background: #a8f0c8; }

  .filter-bar {
    display: flex;
    gap: 6px;
    padding: 10px 20px;
    overflow-x: auto;
    background: var(--primary-dark);
    border-bottom: 1px solid #5010c0;
    -webkit-overflow-scrolling: touch;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .pf-btn {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: #d0c8ff;
    white-space: nowrap;
  }
  .pf-btn.active {
    background: #ffffff;
    border-color: #ffffff;
    color: var(--primary);
    font-weight: 500;
  }
  .pf-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }

  .stats-bar {
    display: flex;
    gap: 0;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: #ebe8fd;
    overflow-x: auto;
  }
  .stat-pill {
    font-size: 12px;
    padding: 8px 14px;
    color: var(--text-muted);
    border-right: 1px solid var(--border);
    white-space: nowrap;
  }
  .stat-pill span { font-weight: 500; color: var(--primary); margin-right: 4px; }

  .main { padding: 16px 20px; max-width: 100%; }

  .prop-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
  }

  .prop-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: #ebe8fd;
    gap: 8px;
  }
  .prop-name { font-size: 13px; font-weight: 500; color: var(--primary); }
  .prop-actions { display: flex; gap: 5px; flex-wrap: wrap; }
  .mini-btn {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
  }
  .mini-btn:hover { background: var(--border); }
  .mini-btn.mb-avail { border-color: var(--green-border); color: var(--green-text); }
  .mini-btn.mb-avail:hover { background: var(--green-bg); }
  .mini-btn.mb-cin   { border-color: var(--blue-border);  color: var(--blue-text); }
  .mini-btn.mb-cin:hover   { background: var(--blue-bg); }
  .mini-btn.mb-cout  { border-color: var(--amber-border); color: var(--amber-text); }
  .mini-btn.mb-cout:hover  { background: var(--amber-bg); }
  .mini-btn.mb-ext   { border-color: var(--purple-border); color: var(--purple-text); }
  .mini-btn.mb-ext:hover   { background: var(--purple-bg); }
  .mini-btn.mb-clear { border-color: var(--red-border); color: var(--red-text); }
  .mini-btn.mb-clear:hover { background: var(--red-bg); }

  .unit-row {
    display: grid;
    grid-template-columns: 150px 1fr auto auto auto auto 140px;
    align-items: center;
    gap: 0;
    border-bottom: 1px solid var(--border);
    padding: 5px 14px;
    min-height: 40px;
  }
  .unit-row:last-child { border-bottom: none; }
  .unit-row:hover { background: #f5f2ff; }

  .unit-label { font-size: 13px; color: var(--text); padding-right: 8px; }

  .guest-input {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 4px 8px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text);
    width: 100%;
  }
  .guest-input:focus { border-color: var(--border-strong); background: var(--surface); outline: none; }
  .guest-input::placeholder { color: var(--text-faint); }

  .chips { display: flex; gap: 5px; padding: 0 6px; }

  .chip {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.1s;
    font-family: 'DM Sans', sans-serif;
  }
  .chip:hover { border-color: var(--border-strong); }
  .chip.on-avail { background: var(--green-bg); border-color: var(--green-border); color: var(--green-text); font-weight: 500; }
  .chip.on-cin   { background: var(--blue-bg);   border-color: var(--blue-border);   color: var(--blue-text);   font-weight: 500; }
  .chip.on-cout  { background: var(--amber-bg);  border-color: var(--amber-border);  color: var(--amber-text);  font-weight: 500; }
  .chip.on-ext   { background: var(--purple-bg); border-color: var(--purple-border); color: var(--purple-text); font-weight: 500; }

  .notes-input {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-muted);
    width: 100%;
  }
  .notes-input:focus { border-color: var(--border-strong); background: var(--surface); outline: none; color: var(--text); }
  .notes-input::placeholder { color: var(--text-faint); }

  /* Mobile layout */
  @media (max-width: 640px) {
    .unit-row {
      grid-template-columns: 1fr;
      gap: 6px;
      padding: 10px 14px;
    }
    .chips { padding: 0; flex-wrap: wrap; }
    .guest-input, .notes-input { background: var(--bg); border-color: var(--border); }
  }

  /* Preview panel */
  .preview-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin: 0 20px 16px;
    overflow: hidden;
    display: none;
  }
  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--primary);
  }
  .preview-header span { font-size: 13px; font-weight: 500; color: #ffffff; }
  .preview-body {
    padding: 14px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    color: var(--text);
    max-height: 400px;
    overflow-y: auto;
  }
  .preview-footer {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .copied-msg { font-size: 12px; color: var(--primary); display: none; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="app-title">&#127970; Hoolio Apartments &mdash; Room Status</span>
    <input type="text" class="date-input" id="rep-date" placeholder="Date e.g. 3 June 2026">
  </div>
  <div class="header-right">
    <div class="save-indicator"><div class="save-dot"></div><span id="save-label">Saved</span></div>
    <button class="btn-reset" onclick="resetAll()">&#8635; Reset ticks</button>
    <button class="btn-copy" onclick="generatePreview()">&#128203; Copy for WhatsApp</button>
  </div>
</header>

<div class="filter-bar" id="filter-bar"></div>

<div class="stats-bar" id="stats-bar"></div>

<div class="main" id="main"></div>

<div class="preview-panel" id="preview-panel">
  <div class="preview-header">
    <span>&#128241; WhatsApp message preview</span>
    <button onclick="document.getElementById('preview-panel').style.display='none'" style="background:transparent;border:none;font-size:18px;color:#ffffff;padding:0;cursor:pointer">&#215;</button>
  </div>
  <div class="preview-body" id="preview-body"></div>
  <div class="preview-footer">
    <button class="btn-copy" onclick="copyText()" style="background:var(--primary);border-color:var(--primary-dark);color:#fff;">&#128203; Copy to clipboard</button>
    <span class="copied-msg" id="copied-msg">&#10003; Copied to clipboard!</span>
  </div>
</div>

<script>
const PROPS = [
  {key:"gaduwa", name:"Gaduwa", units:["Bronze","Diamond","Silver"]},

  {key:"garki_samthia", name:"Garki (Samthia)", units:[
    "101","102","103","201","202","203","301","302","303",
    "401","402","403","501","502","503","601","602","603"
  ]},
  {key:"gudu", name:"Gudu (Allybella)", units:[
    "101 (1 bed)","102 (studio)","104","Big studio 103"
  ]},
  {key:"ibeto", name:"Ibeto", units:["France","Ireland","Italy","Milan","Spain"]},
  {key:"jahi", name:"Jahi", units:[
    "101","102","103","104","105",
    "201","202","203","204","205","206"
  ]},
  {key:"mabushi", name:"Mabushi", units:[
    "101","102","103","104","105","106",
    "201","202","203","204",
    "301","302","303","304",
    "401","402","403","404","405","406"
  ]},
  {key:"wuye", name:"Wuye Block", units:[
    "101","102","103","201","202","203","301","302","303",
    "401","402","403","501","502","503","601","602","603"
  ]},
];

const STORAGE_KEY = "room_checklist_v1";
let state = {};
let activeFilter = "all";

function defaultState() {
  const s = {};
  PROPS.forEach(p => p.units.forEach(u => {
    s[p.key+"||"+u] = {guest:"", avail:false, cin:false, cout:false, ext:false, notes:""};
  }));
  return s;
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state = defaultState();
      Object.keys(parsed.state||{}).forEach(k => { if(state[k]) state[k] = {...state[k], ...parsed.state[k]}; });
      // Do NOT restore saved date — always use today's date (handled after load)
    } else {
      state = defaultState();
    }
  } catch(e) { state = defaultState(); }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      state
    }));
    document.getElementById("save-label").textContent = "Saved " + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  } catch(e) {}
}

function toggle(key, field) {
  const s = state[key]; if(!s) return;
  s[field] = !s[field];
  saveState();
  renderMain();
  updateStats();
}

function setGuest(key, val) { if(state[key]) { state[key].guest=val; saveState(); updateStats(); } }
function setNotes(key, val) { if(state[key]) { state[key].notes=val; saveState(); } }

function tickAll(propKey, field) {
  const p = PROPS.find(x=>x.key===propKey); if(!p) return;
  p.units.forEach(u => {
    const s = state[propKey+"||"+u];
    s.avail=false; s.cin=false; s.cout=false; s.ext=false; s[field]=true;
  });
  saveState(); renderMain(); updateStats();
}

function clearProp(propKey) {
  const p = PROPS.find(x=>x.key===propKey); if(!p) return;
  p.units.forEach(u => {
    const s = state[propKey+"||"+u];
    s.avail=false; s.cin=false; s.cout=false; s.ext=false; s.guest=""; s.notes="";
  });
  saveState(); renderMain(); updateStats();
}

function resetAll() {
  if(!confirm("Reset everything? All ticks, guest names and notes will be cleared.")) return;
  Object.values(state).forEach(s=>{ s.avail=false; s.cin=false; s.cout=false; s.ext=false; s.guest=""; s.notes=""; });
  saveState(); renderMain(); updateStats();
  document.getElementById("preview-panel").style.display="none";
}

function chipClass(field) {
  return {avail:"on-avail",cin:"on-cin",cout:"on-cout",ext:"on-ext"}[field]||"";
}

function buildUnitRow(p, u) {
  const key = p.key+"||"+u;
  const s = state[key];
  const ac = s.avail ? " on-avail":"";
  const cc = s.cin   ? " on-cin":"";
  const oc = s.cout  ? " on-cout":"";
  const ec = s.ext   ? " on-ext":"";
  return `<div class="unit-row">
    <span class="unit-label">${u}</span>
    <input class="guest-input" type="text" placeholder="Guest name" value="${s.guest.replace(/"/g,'&quot;')}"
      onchange="setGuest('${key}',this.value)">
    <div class="chips">
      <button class="chip${ac}" onclick="toggle('${key}','avail')">Available</button>
      <button class="chip${cc}" onclick="toggle('${key}','cin')">Check-in</button>
      <button class="chip${oc}" onclick="toggle('${key}','cout')">Check-out</button>
      <button class="chip${ec}" onclick="toggle('${key}','ext')">Extending</button>
    </div>
    <input class="notes-input" type="text" placeholder="Notes..." value="${s.notes.replace(/"/g,'&quot;')}"
      onchange="setNotes('${key}',this.value)" style="width:130px">
  </div>`;
}

function renderMain() {
  const props = activeFilter==="all" ? PROPS : PROPS.filter(p=>p.key===activeFilter);
  document.getElementById("main").innerHTML = props.map(p => `
    <div class="prop-block">
      <div class="prop-header">
        <span class="prop-name">&#127970; ${p.name}</span>
        <div class="prop-actions">
          <button class="mini-btn mb-avail" onclick="tickAll('${p.key}','avail')">✓ All available</button>
          <button class="mini-btn mb-cin"   onclick="tickAll('${p.key}','cin')">✓ All check-in</button>
          <button class="mini-btn mb-cout"  onclick="tickAll('${p.key}','cout')">✓ All check-out</button>
          <button class="mini-btn mb-ext"   onclick="tickAll('${p.key}','ext')">✓ All extending</button>
          <button class="mini-btn mb-clear" onclick="clearProp('${p.key}')">✕ Clear</button>
        </div>
      </div>
      ${p.units.map(u=>buildUnitRow(p,u)).join("")}
    </div>
  `).join("");
}

function renderFilterBar() {
  const btns = [`<button class="pf-btn active" onclick="setFilter('all',this)">All properties</button>`];
  PROPS.forEach(p => btns.push(`<button class="pf-btn" onclick="setFilter('${p.key}',this)">${p.name}</button>`));
  document.getElementById("filter-bar").innerHTML = btns.join("");
}

function setFilter(key, btn) {
  activeFilter = key;
  document.querySelectorAll(".pf-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderMain();
}

function updateStats() {
  const vals = Object.values(state);
  const a=vals.filter(s=>s.avail).length;
  const ci=vals.filter(s=>s.cin).length;
  const co=vals.filter(s=>s.cout).length;
  const ex=vals.filter(s=>s.ext).length;
  document.getElementById("stats-bar").innerHTML = `
    <div class="stat-pill"><span>${a}</span>available</div>
    <div class="stat-pill"><span>${ci}</span>check-in</div>
    <div class="stat-pill"><span>${co}</span>check-out</div>
    <div class="stat-pill"><span>${ex}</span>extending</div>
  `;
}

function generatePreview() {
  const date = document.getElementById("rep-date").value ||
    new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  let lines = ["*HOOLIO APARTMENTS — ROOM STATUS REPORT*", "Date: "+date];

  PROPS.forEach(p => {
    const avail=[], cin=[], cout=[], ext=[];
    p.units.forEach(u => {
      const s = state[p.key+"||"+u];
      const label = u + (s.guest?" — "+s.guest:"") + (s.notes?" ("+s.notes+")":"");
      if(s.avail) avail.push(label);
      if(s.cin)   cin.push(label);
      if(s.cout)  cout.push(label);
      if(s.ext)   ext.push(label);
    });
    if(!avail.length && !cin.length && !cout.length && !ext.length) return;
    lines.push("", "📍 *"+p.name+"*");
    if(avail.length){ lines.push("🟢 Available"); avail.forEach(x=>lines.push("  • "+x)); }
    if(cin.length)  { lines.push("🔵 Check-in");  cin.forEach(x=>lines.push("  • "+x)); }
    if(cout.length) { lines.push("🟡 Check-out"); cout.forEach(x=>lines.push("  • "+x)); }
    if(ext.length)  { lines.push("🟣 Extending"); ext.forEach(x=>lines.push("  • "+x)); }
  });

  document.getElementById("preview-body").textContent = lines.join("\n");
  const panel = document.getElementById("preview-panel");
  panel.style.display = "block";
  panel.scrollIntoView({behavior:"smooth", block:"start"});
  document.getElementById("copied-msg").style.display="none";
}

function copyText() {
  const text = document.getElementById("preview-body").textContent;
  navigator.clipboard.writeText(text).then(() => {
    const m = document.getElementById("copied-msg");
    m.style.display="inline";
    setTimeout(()=>m.style.display="none", 3000);
  });
}

document.getElementById("rep-date").addEventListener("change", saveState);
document.getElementById("rep-date").addEventListener("input", saveState);

loadState();
// Always show today's date when the app is opened
document.getElementById("rep-date").value =
  new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
renderFilterBar();
renderMain();
updateStats();
</script>
</body>
</html>
